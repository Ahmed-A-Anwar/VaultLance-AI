name: ci

on:
  pull_request:
  push:
    branches: [main]

# Two independent jobs so a frontend type error and a backend test failure are
# reported separately. Playwright is deliberately not here: the specs under
# tests/ drive a browser against the dev server and several still assert the
# pre-real-API mocks (see README "e2e quarantine").
jobs:
  frontend:
    name: frontend (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  backend:
    name: backend (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
