# Fly.io config for the VaultLance API. Build context is this directory.
#
# No [deploy] release_command: Supabase owns the schema and the money-loop DDL
# runs idempotently from the app at boot (src/money/schema.ts), so a release
# command that waits on a database it cannot reach is not needed.
app = "vaultlance-ai"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_VERSION = "phase1-money-loop"
  # Sandbox only: the process refuses to start when this is anything else.
  PAYPAL_ENV = "sandbox"
  PUBLIC_API_URL = "https://vaultlance-ai.fly.dev"
  FRONTEND_URL = "https://vault-lance-ai.vercel.app"
  FRONTEND_ORIGINS = "https://vault-lance-ai.vercel.app,http://localhost:5173"
  # Private bucket that holds deliverables. Both the upload adapter and the
  # signed-download route read this name; the default is "vault-files".
  SUPABASE_STORAGE_BUCKET = "vault-deliverables"
  AI_SERVICE_URL = "http://vaultlance-ai-engine.internal:8000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1 = no cold start for judges; lower to 0 after the demo to save money.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
