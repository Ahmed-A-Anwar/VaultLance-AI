<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault — Scroll Sequence</title>
<!--
  ─────────────────────────────────────────────────────────────────────
  Scroll-linked canvas image sequence (AirPods-style).

  Drop this file next to your "Vault" frame folder, or change
  FRAMES_DIR below to point at wherever the frames live on your site.
  Requires nothing else: GSAP + ScrollTrigger load from CDN.
  ─────────────────────────────────────────────────────────────────────
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:  #f2f3f4;  /* matches the frame background grey */
    --ink: #17181a;
    --muted: #6b6d70;
  }

  html { scroll-behavior: auto; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Simple page filler above / below so the pin has context ── */
  .copy {
    min-height: 100svh;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2rem;
  }
  .copy h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 650; letter-spacing: -0.02em; }
  .copy p  { margin-top: 0.75rem; color: var(--muted); font-size: 1.05rem; }

  /* ── The sequence section: its height sets how long the scrub runs ── */
  .sequence {
    /* 400vh section → 300vh of pinned scrubbing. Tune to taste. */
    height: 400svh;
    position: relative;
  }

  .pin-stage {
    position: relative;
    height: 100svh;
    width: 100%;
    overflow: hidden;
  }

  /* Static first frame — shown instantly and doubles as the no-JS fallback */
  .fallback-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
    will-change: transform;
  }
  canvas.is-ready { opacity: 1; }

  /* ── Loading overlay: graceful state while frames preload ── */
  .loader {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 1rem;
    justify-items: center;
    background: var(--bg);
    z-index: 2;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }

  .loader .ring {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2.5px solid #d8d9db;
    border-top-color: var(--ink);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader .status {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    canvas { transition: none; }
  }
</style>
</head>
<body>

  <section class="copy" aria-label="Intro">
    <h1>The Vault</h1>
    <p>Scroll to rotate</p>
  </section>

  <!-- Scroll scrub runs across this whole section while the canvas is pinned -->
  <section class="sequence" aria-label="Rotating vault sequence">
    <div class="pin-stage">
      <img class="fallback-frame"
           src="./Vault/ezgif-frame-001.jpg"
           alt="Vault safe"
           decoding="async">
      <canvas id="seq-canvas" aria-hidden="true"></canvas>
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="ring" aria-hidden="true"></div>
        <div class="status" id="loader-status">Loading frames… 0%</div>
      </div>
    </div>
  </section>

  <section class="copy" aria-label="Outro">
    <h1>Locked tight</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
  (() => {
    'use strict';

    /* ───────────────── configuration ───────────────── */
    const FRAMES_DIR = './Vault/';                       // folder holding the frames
    const FRAME_NAME = i => `ezgif-frame-${String(i).padStart(3, '0')}.jpg`;
    const FRAME_COUNT = 300;                             // 001 → 300
    const SCROLL_LENGTH_VH = 300;                        // scrub distance in viewport-heights
    /* ───────────────────────────────────────────────── */

    gsap.registerPlugin(ScrollTrigger);
    // Stops pin/progress from jumping on mobile when the address bar collapses
    ScrollTrigger.config({ ignoreMobileResize: true });

    const canvas  = document.getElementById('seq-canvas');
    const stage   = canvas.parentElement;                // .pin-stage
    const ctx     = canvas.getContext('2d');
    const loader  = document.getElementById('loader');
    const status  = document.getElementById('loader-status');

    const state   = { frame: 0 };
    const frames  = new Array(FRAME_COUNT).fill(null);   // index → loaded Image (or null on failure)
    let lastIndex = 0;                                   // highest successfully loaded frame
    let ready     = false;
    /* ───────────────── worker helpers ───────────────── */
    const loadImage = src => new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.onload  = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });

    function resizeCanvas() {
      // Cap DPR at 2: beyond that the 1280px source frames gain nothing
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w   = stage.clientWidth;
      const h   = stage.clientHeight;
      if (!w || !h) return;
      canvas.width  = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    /* Draw like object-fit: cover — fills the viewport, keeps the vault centered */
    function render() {
      if (!canvas.width || !canvas.height) return;
      const W = stage.clientWidth, H = stage.clientHeight;
      ctx.clearRect(0, 0, W, H);

      // Nearest loaded frame (skips any that failed to fetch)
      let i = Math.min(Math.max(Math.round(state.frame), 0), lastIndex);
      let img = frames[i];
      if (!img) {                       // walk outward to a neighbour that decoded
        for (let d = 1; d <= FRAME_COUNT; d++) {
          img = frames[i - d] || frames[i + d] || null;
          if (img) break;
        }
      }
      if (!img) return;

      const s  = Math.max(W / img.width, H / img.height);
      const dw = img.width * s, dh = img.height * s;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }

    /* ───────────────── preload everything first ───────────────── */
    let loadedSoFar = 0;
    const urls = Array.from({ length: FRAME_COUNT }, (_, i) => FRAMES_DIR + FRAME_NAME(i + 1));

    async function init() {
      await Promise.allSettled(urls.map((src, i) =>
        loadImage(src).then(img => {
          if (img) { frames[i] = img; if (i + 1 > lastIndex) lastIndex = i + 1; }
          if ((++loadedSoFar - 1) % 10 === 0) {
            status.textContent = `Loading frames… ${Math.round(loadedSoFar / FRAME_COUNT * 100)}%`;
          }
        })
      ));

      const okCount = frames.filter(Boolean).length;
      status.textContent = okCount
        ? `Loaded ${okCount}/${FRAME_COUNT} frames`
        : 'Frames could not be loaded';

      if (okCount) {
        resizeCanvas();
        ready = true;
        canvas.classList.add('is-ready');
      } else {
        // Totalfailure: keep the static fallback frame visible, no scrub
        console.warn('[vault-scroll] No frames loaded — serving static fallback image.');
      }
      loader.classList.add('is-done');

      /* ───────────────── pin + scrub the sequence ───────────────── */
      if (ready) {
        gsap.to(state, {
          frame: FRAME_COUNT - 1,
          ease: 'none',
          onUpdate: render,
          scrollTrigger: {
            trigger: '.sequence',
            start: 'top top',
            end: 'bottom bottom',
            pin: '.pin-stage',
            pinSpacing: true,
            anticipatePin: 1,
            scrub: true,             // position is linked 1:1 to the scrollbar
            invalidateOnRefresh: true,
          },
        });
      }

      window.addEventListener('resize', () => { resizeCanvas(); ScrollTrigger.refresh(); }, { passive: true });
    }

    init();
  })();
  </script>
</body>
</html>
