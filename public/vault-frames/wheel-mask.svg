<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="wheel-feather" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#000" stop-opacity="1"/>
      <stop offset="95%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wheel-clip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>
  <!-- placeholder: the real wheel crop is the canvas-drawn frame 1 masked with this circle -->
  <g clip-path="url(#wheel-clip)">
    <circle cx="100" cy="100" r="96" fill="url(#wheel-feather)" />
  </g>
</svg>
